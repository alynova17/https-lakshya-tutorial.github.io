<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LT Tests & Quizzes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.top{background:#111827;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #00000008}.muted{color:#6b7280}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.hidden{display:none}.option{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer}.option.selected{border-color:#111827;background:#f3f4f6}.qhead{font-weight:700;line-height:1.5}.result{font-size:28px;font-weight:800}.correct{color:#166534}.wrong{color:#991b1b}.history-row{padding:10px 0;border-bottom:1px solid #eee}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px}
</style></head><body>
<header class="top"><div class="brand">LT — Tests & Quizzes</div><button class="btn secondary" onclick="location.href='student-dashboard.html'">Dashboard</button></header>
<main class="wrap">
<section id="start" class="card"><h1>📝 LT Science Basics Test</h1><p class="muted">10 multiple-choice questions • 10 marks • One attempt at a time</p><p>This is a starter demo test. You can replace these questions later with your own LT subject/chapter questions.</p><button id="startBtn" class="btn primary">Start Test</button></section>
<section id="test" class="hidden"></section>
<section id="result" class="card hidden"></section>
<section id="history" class="card"><h2>Previous Results</h2><div id="historyList" class="muted">Loading...</div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,addDoc,query,where,orderBy,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const questions=[
 {q:'Which organelle is known as the powerhouse of the cell?',o:['Nucleus','Mitochondrion','Ribosome','Golgi apparatus'],a:1},
 {q:'What is the SI unit of force?',o:['Joule','Watt','Newton','Pascal'],a:2},
 {q:'Which gas is most abundant in Earth’s atmosphere?',o:['Oxygen','Nitrogen','Carbon dioxide','Hydrogen'],a:1},
 {q:'What is the basic unit of heredity?',o:['Cell','Tissue','Gene','Organ'],a:2},
 {q:'Which particle has a negative electric charge?',o:['Proton','Neutron','Electron','Nucleus'],a:2},
 {q:'Which process do green plants use to make food?',o:['Respiration','Photosynthesis','Digestion','Fermentation'],a:1},
 {q:'What is the approximate speed of light in vacuum?',o:['3×10^8 m/s','3×10^6 m/s','3×10^4 m/s','3×10^2 m/s'],a:0},
 {q:'A substance with pH below 7 is generally:',o:['Acidic','Basic','Neutral','Always a salt'],a:0},
 {q:'Which blood cells primarily help fight infections?',o:['Red blood cells','White blood cells','Platelets','Plasma'],a:1},
 {q:'Which form of energy is stored in a stretched spring?',o:['Chemical','Nuclear','Elastic potential','Sound'],a:2}
];
let user=null,student=null,answers=Array(questions.length).fill(null),started=false;
const $=id=>document.getElementById(id);
function renderTest(){
 $('start').classList.add('hidden');$('result').classList.add('hidden');$('test').classList.remove('hidden');
 $('test').innerHTML='<div class="card"><h2>LT Science Basics Test</h2><p class="muted">Choose one answer for each question.</p></div>'+questions.map((x,i)=>`<div class="card"><div class="qhead">${i+1}. ${x.q}</div>${x.o.map((v,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}">${v}</button>`).join('')}</div>`).join('')+'<div class="card"><button id="submitBtn" class="btn primary">Submit Test</button></div>';
 document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{answers[+b.dataset.q]=+b.dataset.a;renderTest();}));
 $('submitBtn').addEventListener('click',submitTest);
}
async function submitTest(){
 if(answers.some(v=>v===null)){alert('Please answer all questions before submitting.');return;}
 let score=0;answers.forEach((v,i)=>{if(v===questions[i].a)score++;});
 const percent=Math.round(score/questions.length*100);
 try{await addDoc(collection(db,'testResults'),{uid:user.uid,studentId:student.studentId||'',studentName:student.name||'Student',testId:'science-basics-01',testName:'LT Science Basics Test',score,total:questions.length,percentage:percent,answers,createdAt:serverTimestamp()});}catch(e){console.log('Result save failed:',e.message);}
 $('test').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2>Test Completed</h2><div class="result">${score} / ${questions.length}</div><p>${percent}%</p><p class="muted">Your result has been recorded when Firestore permissions allow it.</p><button class="btn primary" id="retry">Try Again</button> <button class="btn secondary" onclick="location.href='student-dashboard.html'">Dashboard</button><div style="margin-top:20px"><h3>Review</h3>${questions.map((x,i)=>{const ok=answers[i]===x.a;return `<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${i+1}. ${x.q}</b><div class="${ok?'correct':'wrong'}">${ok?'Correct':'Incorrect'} — Correct answer: ${x.o[x.a]}</div></div>`}).join('')}</div>`;
 $('retry').addEventListener('click',()=>{answers=Array(questions.length).fill(null);renderTest();});
 loadHistory();
}
async function loadHistory(){if(!user)return;try{const q=query(collection(db,'testResults'),where('uid','==',user.uid),orderBy('createdAt','desc'));const s=await getDocs(q);if(s.empty){$('historyList').textContent='No previous test results yet.';return;}$('historyList').innerHTML=s.docs.slice(0,10).map(d=>{const x=d.data();return `<div class="history-row"><b>${x.testName||'Test'}</b><br><span class="pill">${x.score||0}/${x.total||0}</span> <span class="pill">${x.percentage||0}%</span></div>`}).join('');}catch(e){$('historyList').textContent='Previous results will appear here after Firestore permissions are configured.';}}
onAuthStateChanged(auth,async u=>{if(!u){location.href='index.html';return;}user=u;const s=await getDoc(doc(db,'students',u.uid));student=s.exists()?s.data():{name:'Student',studentId:''};loadHistory();});
$('startBtn').addEventListener('click',()=>{started=true;renderTest();});
</script></body></html>
