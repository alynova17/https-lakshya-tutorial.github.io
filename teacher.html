<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LT Teacher Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9dee7;border-radius:10px;padding:10px 14px;background:#fff;cursor:pointer;font-weight:600}.primary{background:#111;color:#fff;border-color:#111}.danger{background:#fff1f0;color:#b42318}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 7px 22px #0000000a}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.muted{color:#667085}.stat{font-size:38px;font-weight:800;margin:5px 0}.input,.textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:10px;margin:7px 0;font:inherit}.textarea{min-height:100px;resize:vertical}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;vertical-align:top}th{font-size:13px;color:#667085;text-transform:uppercase}.table-wrap{overflow:auto}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.editbox{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}.msg{min-height:22px;margin:8px 0}.ok{color:#027a48}.err{color:#b42318}@media(max-width:650px){.hero{display:block}th,td{min-width:130px}}
</style>
</head>
<body>
<header><div class="brand">LT — Teacher Dashboard</div><div class="actions"><button class="btn" id="homeBtn">← Home</button><button class="btn danger" id="logoutBtn">Logout</button></div></header>
<main class="wrap">
<section class="card hero"><div><h1 style="margin:0 0 6px">Teacher Dashboard</h1><div class="muted">Manage students and publish announcements for Lakshya Tutorial.</div></div><div><div class="muted">Registered Students</div><div class="stat" id="studentCount">0</div></div></section>
<section class="card"><h2>Students</h2><input class="input" id="studentSearch" placeholder="Search by name, email or LT ID"><div class="table-wrap"><table><thead><tr><th>Name</th><th>LT ID</th><th>DOB</th><th>Email</th><th>Action</th></tr></thead><tbody id="studentList"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><p class="msg" id="studentMsg"></p></section>
<section class="card"><h2>Post Announcement</h2><input class="input" id="announcementTitle" placeholder="Announcement title"><textarea class="textarea" id="announcementText" placeholder="Write the announcement"></textarea><button class="btn primary" id="postAnnouncement">Post Announcement</button><p class="msg" id="announcementMsg"></p></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,setDoc,addDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"});
const auth=getAuth(app),db=getFirestore(app);const teacherEmail="mdnazimansari333@gmail.com";let students=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=document.getElementById('studentList'),search=document.getElementById('studentSearch');
function render(){const q=search.value.trim().toLowerCase();const rows=students.filter(s=>[s.name,s.email,s.studentId,s.dob].join(' ').toLowerCase().includes(q));if(!rows.length){list.innerHTML='<tr><td colspan="5">No students found.</td></tr>';return;}list.innerHTML=rows.map(s=>`<tr><td><b>${esc(s.name||'Student')}</b></td><td>${esc(s.studentId||'Not assigned')}</td><td>${esc(s.dob||'')}</td><td>${esc(s.email||'')}</td><td><div class="row-actions"><button class="btn" data-edit="${esc(s.uid)}">Edit</button></div><div id="edit-${esc(s.uid)}"></div></td></tr>`).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showEdit(b.dataset.edit));}
function showEdit(uid){const s=students.find(x=>x.uid===uid);if(!s)return;const box=document.getElementById('edit-'+uid);box.className='editbox';box.innerHTML=`<input class="input" id="en-${uid}" value="${esc(s.name||'')}"><input class="input" id="ed-${uid}" type="date" value="${esc(s.dob||'')}"><input class="input" id="ee-${uid}" type="email" value="${esc(s.email||'')}"><button class="btn primary" id="save-${uid}">Save</button>`;document.getElementById('save-'+uid).onclick=async()=>{try{await setDoc(doc(db,'students',uid),{name:document.getElementById('en-'+uid).value.trim(),dob:document.getElementById('ed-'+uid).value,email:document.getElementById('ee-'+uid).value.trim(),studentId:s.studentId||''},{merge:true});Object.assign(s,{name:document.getElementById('en-'+uid).value.trim(),dob:document.getElementById('ed-'+uid).value,email:document.getElementById('ee-'+uid).value.trim()});render();document.getElementById('studentMsg').textContent='Student updated successfully.';document.getElementById('studentMsg').className='msg ok';}catch(e){document.getElementById('studentMsg').textContent=e.message;document.getElementById('studentMsg').className='msg err';}}}
async function loadStudents(){const snap=await getDocs(collection(db,'students'));students=snap.docs.map(d=>({uid:d.id,...d.data()}));document.getElementById('studentCount').textContent=students.length;render();}
search.addEventListener('input',render);document.getElementById('homeBtn').onclick=()=>location.href='index.html';document.getElementById('logoutBtn').onclick=async()=>{await signOut(auth);location.href='index.html'};
document.getElementById('postAnnouncement').onclick=async()=>{const title=document.getElementById('announcementTitle').value.trim(),text=document.getElementById('announcementText').value.trim(),m=document.getElementById('announcementMsg');if(!title||!text){m.textContent='Please enter both title and message.';m.className='msg err';return;}try{await addDoc(collection(db,'announcements'),{title,text,createdAt:new Date().toISOString()});document.getElementById('announcementTitle').value='';document.getElementById('announcementText').value='';m.textContent='Announcement posted successfully.';m.className='msg ok';}catch(e){m.textContent=e.message;m.className='msg err';}};
onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return;}if((user.email||'').toLowerCase()!==teacherEmail.toLowerCase()){alert('Teacher access denied.');await signOut(auth);location.href='index.html';return;}try{await loadStudents();}catch(e){document.getElementById('studentMsg').textContent=e.message;document.getElementById('studentMsg').className='msg err';}});
</script>
</body></html>
