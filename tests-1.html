<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LT Tests & Quizzes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.top{background:#111827;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10}.brand{font-weight:800}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #00000008}.muted{color:#667085}.btn{border:1px solid #d9dee7;border-radius:10px;padding:11px 15px;background:#fff;color:#172033;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff;border-color:#111827}.hidden{display:none}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.select,.input{width:100%;padding:11px;border:1px solid #d9dee7;border-radius:10px;background:#fff;font:inherit}.test-card{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f3f6;font-size:12px;margin:2px}.option{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer}.option.selected{border-color:#111827;background:#f3f4f6}.qhead{font-weight:700;line-height:1.5}.result{font-size:30px;font-weight:800}.correct{color:#166534}.wrong{color:#991b1b}.history-row{padding:11px 0;border-bottom:1px solid #eee}.timer{font-weight:800;font-size:20px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111827;width:0}.empty{padding:20px;text-align:center;color:#667085}@media(max-width:650px){.filters{grid-template-columns:1fr}.test-card{display:block}.test-card .btn{margin-top:10px}}
</style></head><body>
<header class="top"><div class="brand">LT — Tests & Quizzes</div><button class="btn" onclick="location.href='student-dashboard.html'">Dashboard</button></header>
<main class="wrap">
<section id="browser" class="card"><h1>📝 Tests & Quizzes</h1><p class="muted">Choose a subject, chapter and difficulty. Published teacher tests will appear here.</p><div class="filters"><select id="subjectFilter" class="select"><option value="">All Subjects</option></select><select id="chapterFilter" class="select"><option value="">All Chapters</option></select><select id="difficultyFilter" class="select"><option value="">All Difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div></section>
<section id="testList"></section>
<section id="testRunner" class="hidden"></section>
<section id="result" class="card hidden"></section>
<section id="history" class="card"><h2>Previous Results</h2><div id="historyList" class="muted">Loading...</div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs,addDoc,where,query,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo={id:'demo-science-basics-01',title:'LT Science Basics Test',subject:'Science',chapter:'General Science',difficulty:'Easy',durationMinutes:0,published:true,questions:[
{question:'Which organelle is known as the powerhouse of the cell?',options:['Nucleus','Mitochondrion','Ribosome','Golgi apparatus'],answer:1},
{question:'What is the SI unit of force?',options:['Joule','Watt','Newton','Pascal'],answer:2},
{question:'Which gas is most abundant in Earth’s atmosphere?',options:['Oxygen','Nitrogen','Carbon dioxide','Hydrogen'],answer:1},
{question:'What is the basic unit of heredity?',options:['Cell','Tissue','Gene','Organ'],answer:2},
{question:'Which particle has a negative electric charge?',options:['Proton','Neutron','Electron','Nucleus'],answer:2},
{question:'Which process do green plants use to make food?',options:['Respiration','Photosynthesis','Digestion','Fermentation'],answer:1},
{question:'What is the approximate speed of light in vacuum?',options:['3×10^8 m/s','3×10^6 m/s','3×10^4 m/s','3×10^2 m/s'],answer:0},
{question:'A substance with pH below 7 is generally:',options:['Acidic','Basic','Neutral','Always a salt'],answer:0},
{question:'Which blood cells primarily help fight infections?',options:['Red blood cells','White blood cells','Platelets','Plasma'],answer:1},
{question:'Which form of energy is stored in a stretched spring?',options:['Chemical','Nuclear','Elastic potential','Sound'],answer:2}]};
let user=null,student=null,tests=[],current=null,answers=[],timerId=null,timeLeft=0;
function normalize(t,id){const d=t.data?t.data():t;return{id:id||t.id,...d,questions:Array.isArray(d.questions)?d.questions:[]};}
async function loadTests(){try{const snap=await getDocs(collection(db,'tests'));tests=snap.docs.map(d=>normalize(d)).filter(t=>t.published!==false&&t.questions.length); }catch(e){tests=[];}if(!tests.length)tests=[demo];renderFilters();renderList();}
function renderFilters(){const subjects=[...new Set(tests.map(t=>t.subject).filter(Boolean))].sort();$('subjectFilter').innerHTML='<option value="">All Subjects</option>'+subjects.map(x=>`<option>${esc(x)}</option>`).join('');renderChapters();}
function renderChapters(){const sub=$('subjectFilter').value;const chapters=[...new Set(tests.filter(t=>!sub||t.subject===sub).map(t=>t.chapter).filter(Boolean))].sort();$('chapterFilter').innerHTML='<option value="">All Chapters</option>'+chapters.map(x=>`<option>${esc(x)}</option>`).join('');}
function renderList(){const sub=$('subjectFilter').value,ch=$('chapterFilter').value,dif=$('difficultyFilter').value;const list=tests.filter(t=>(!sub||t.subject===sub)&&(!ch||t.chapter===ch)&&(!dif||t.difficulty===dif));if(!list.length){$('testList').innerHTML='<div class="card empty">No published tests match these filters.</div>';return;}$('testList').innerHTML=list.map(t=>`<section class="card test-card"><div><h2 style="margin:0 0 8px">${esc(t.title||'LT Test')}</h2><span class="tag">${esc(t.subject||'General')}</span><span class="tag">${esc(t.chapter||'General')}</span><span class="tag">${esc(t.difficulty||'Medium')}</span><span class="tag">${t.questions.length} questions</span>${Number(t.durationMinutes)>0?`<span class="tag">${Number(t.durationMinutes)} min</span>`:'<span class="tag">No timer</span>'}</div><button class="btn primary" data-start="${esc(t.id)}">Start Test</button></section>`).join('');document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startTest(b.dataset.start));}
function startTest(id){current=tests.find(t=>t.id===id);if(!current)return;answers=Array(current.questions.length).fill(null);$('browser').classList.add('hidden');$('history').classList.add('hidden');$('testList').classList.add('hidden');$('result').classList.add('hidden');$('testRunner').classList.remove('hidden');timeLeft=Math.max(0,Number(current.durationMinutes)||0)*60;renderRunner();if(timeLeft>0){timerId=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerId);timerId=null;submitTest(true);}},1000);}}
function updateTimer(){const el=$('timer');if(!el)return;const m=Math.floor(timeLeft/60),s=timeLeft%60;el.textContent=`Time left: ${m}:${String(s).padStart(2,'0')}`;}
function renderRunner(){const answered=answers.filter(v=>v!==null).length;$('testRunner').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">${esc(current.title||'LT Test')}</h2><p class="muted">${esc(current.subject||'')} • ${esc(current.chapter||'')} • ${esc(current.difficulty||'')}</p></div><div id="timer" class="timer"></div></div><div class="progress" style="margin-top:12px"><div style="width:${Math.round(answered/current.questions.length*100)}%"></div></div><p class="muted">${answered}/${current.questions.length} answered</p></div>`+current.questions.map((q,i)=>`<div class="card"><div class="qhead">${i+1}. ${esc(q.question||q.q||'Question')}</div>${(q.options||q.o||[]).map((v,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}">${esc(v)}</button>`).join('')}</div>`).join('')+`<div class="card"><button class="btn primary" id="submitBtn">Submit Test</button> <button class="btn" id="cancelBtn">Exit Test</button></div>`;updateTimer();document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;renderRunner();});$('submitBtn').onclick=()=>submitTest(false);$('cancelBtn').onclick=()=>{if(timerId){clearInterval(timerId);timerId=null;}current=null;$('testRunner').classList.add('hidden');$('browser').classList.remove('hidden');$('testList').classList.remove('hidden');$('history').classList.remove('hidden');};}
async function submitTest(auto=false){if(!current)return;if(timerId){clearInterval(timerId);timerId=null;}if(!auto&&answers.some(v=>v===null)){alert('Please answer all questions before submitting.');return;}let score=0;current.questions.forEach((q,i)=>{const a=Number(q.answer??q.a);if(answers[i]===a)score++;});const total=current.questions.length,percent=Math.round(score/total*100);let saved=true;try{await addDoc(collection(db,'testResults'),{uid:user.uid,studentId:student.studentId||'',studentName:student.name||'Student',testId:current.id,testName:current.title||'LT Test',subject:current.subject||'',chapter:current.chapter||'',difficulty:current.difficulty||'',score,total,percentage:percent,answers,createdAt:serverTimestamp()});}catch(e){saved=false;console.log(e.message);} $('testRunner').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2>Test Completed</h2>${auto?'<p class="wrong"><b>Time ended.</b> Unanswered questions were counted as incorrect.</p>':''}<div class="result">${score} / ${total}</div><p><b>${percent}%</b></p><p class="muted">${saved?'Your result was saved to your LT account.':'The result could not be saved yet. Check Firestore permissions.'}</p><button class="btn primary" id="retryBtn">Try Again</button> <button class="btn" id="backTests">All Tests</button><div style="margin-top:20px"><h3>Review</h3>${current.questions.map((q,i)=>{const a=Number(q.answer??q.a),ok=answers[i]===a;return `<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${i+1}. ${esc(q.question||q.q||'Question')}</b><div class="${ok?'correct':'wrong'}">${ok?'Correct':'Incorrect'} — Correct answer: ${esc((q.options||q.o||[])[a]??'Not provided')}</div></div>`}).join('')}</div>`;$('retryBtn').onclick=()=>startTest(current.id);$('backTests').onclick=()=>{current=null;$('result').classList.add('hidden');$('browser').classList.remove('hidden');$('testList').classList.remove('hidden');$('history').classList.remove('hidden');renderList();loadHistory();};loadHistory();}
async function loadHistory(){if(!user)return;try{const snap=await getDocs(query(collection(db,'testResults'),where('uid','==',user.uid)));const rows=snap.docs.map(d=>d.data()).sort((a,b)=>{const at=a.createdAt?.seconds||0,bt=b.createdAt?.seconds||0;return bt-at;}).slice(0,10);if(!rows.length){$('historyList').textContent='No previous test results yet.';return;}$('historyList').innerHTML=rows.map(x=>`<div class="history-row"><b>${esc(x.testName||'Test')}</b><br><span class="tag">${esc(x.subject||'')}</span> <span class="tag">${Number(x.score)||0}/${Number(x.total)||0}</span> <span class="tag">${Number(x.percentage)||0}%</span></div>`).join('');}catch(e){$('historyList').textContent='Previous results will appear here after Firestore permissions are configured.';}}
$('subjectFilter').onchange=()=>{renderChapters();renderList();};$('chapterFilter').onchange=renderList;$('difficultyFilter').onchange=renderList;
onAuthStateChanged(auth,async u=>{if(!u){location.href='index.html';return;}user=u;const s=await getDoc(doc(db,'students',u.uid));student=s.exists()?s.data():{name:'Student',studentId:''};await loadTests();loadHistory();});
</script></body></html>
