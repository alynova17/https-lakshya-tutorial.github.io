<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LT Study Materials</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e9f2;padding:18px}.wrap{max-width:1050px;margin:auto}.brand{font-size:23px;font-weight:800}.sub{color:#687386;margin-top:5px}.nav{margin-top:14px}.nav a{margin-right:14px;text-decoration:none;color:#3157d5;font-weight:700}main{padding:22px 16px}.search{width:100%;padding:14px 16px;border:1px solid #dce2ec;border-radius:14px;font-size:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}select{width:100%;padding:13px;border:1px solid #dce2ec;border-radius:12px;background:#fff;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(20,30,50,.04)}.tag{font-size:12px;font-weight:700;background:#eef2ff;padding:5px 9px;border-radius:999px}.card h2{font-size:19px;margin:12px 0 8px}.card p{color:#687386;line-height:1.5}.open{display:inline-block;background:#3157d5;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:700}.empty{background:#fff;border:1px dashed #ccd3df;border-radius:16px;padding:30px;text-align:center;color:#687386}@media(max-width:600px){.controls{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><div class="brand">LT · Study Materials</div><div class="sub">Study resources for Classes 1–12.</div><div class="nav"><a href="student-dashboard.html">Dashboard</a><a href="index.html">Home</a></div></div></header>
<main class="wrap"><input id="search" class="search" placeholder="Search class, subject or chapter..."><div class="controls"><select id="classSelect"><option value="All">All Classes</option></select><select id="subjectSelect"><option value="All">All Subjects</option></select></div><div id="grid" class="grid"></div></main>
<script>
const data=[
['Class 1','Mathematics','Chapter 1','Numbers'],['Class 1','English','Chapter 1','Reading & Writing'],['Class 2','Mathematics','Chapter 1','Addition'],['Class 3','Science','Chapter 1','Living Things'],['Class 4','Social Science','Chapter 1','Our Community'],['Class 5','English','Chapter 1','Grammar Basics'],['Class 6','Mathematics','Chapter 1','Knowing Our Numbers'],['Class 6','Science','Chapter 1','Food: Where Does It Come From?'],['Class 7','Mathematics','Chapter 1','Integers'],['Class 7','Science','Chapter 1','Nutrition in Plants'],['Class 8','Mathematics','Chapter 1','Rational Numbers'],['Class 8','Science','Chapter 1','Crop Production'],['Class 9','Mathematics','Chapter 1','Number Systems'],['Class 9','Science','Chapter 1','Matter in Our Surroundings'],['Class 10','Mathematics','Chapter 1','Real Numbers'],['Class 10','Science','Chapter 1','Chemical Reactions'],['Class 11','Physics','Chapter 1','Units and Measurements'],['Class 11','Chemistry','Chapter 1','Some Basic Concepts of Chemistry'],['Class 11','Biology','Chapter 1','The Living World'],['Class 12','Physics','Chapter 1','Electric Charges and Fields'],['Class 12','Chemistry','Chapter 1','Solutions'],['Class 12','Biology','Chapter 1','Reproduction in Organisms']];
const cs=document.getElementById('classSelect'), ss=document.getElementById('subjectSelect'), search=document.getElementById('search'), grid=document.getElementById('grid');
for(let i=1;i<=12;i++)cs.insertAdjacentHTML('beforeend',`<option>Class ${i}</option>`);
function updateSubjects(){let c=cs.value;let subs=[...new Set(data.filter(x=>c==='All'||x[0]===c).map(x=>x[1]))].sort();ss.innerHTML='<option value="All">All Subjects</option>'+subs.map(x=>`<option>${x}</option>`).join('');render()}
function render(){let q=search.value.toLowerCase(),c=cs.value,s=ss.value;let a=data.filter(x=>(c==='All'||x[0]===c)&&(s==='All'||x[1]===s)&&(!q||x.join(' ').toLowerCase().includes(q)));grid.innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">${x[0]} · ${x[1]}</span><h2>${x[3]}</h2><p><b>${x[2]}</b><br>Material can be connected here later.</p><a class="open" href="#" onclick="return false">Open Material</a></article>`).join(''):'<div class="empty">No matching study materials found.</div>'}
cs.onchange=updateSubjects;ss.onchange=render;search.oninput=render;updateSubjects();
</script></body></html>
