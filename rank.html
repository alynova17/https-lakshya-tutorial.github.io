<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LT Rank</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.top{background:#111827;color:white;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.big{font-size:34px;font-weight:800}.muted{color:#6b7280}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.dark{background:#111827;color:white}.light{background:#e5e7eb;color:#111827}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">LT — LT Rank</div><button class="btn light" id="logout">Logout</button></header><main class="wrap"><div class="card"><button class="btn light" onclick="location.href='student-dashboard.html'">← Dashboard</button> <button class="btn dark" onclick="location.href='tests.html'">Take a Test</button></div><div class="card"><h1>🏆 LT Rank</h1><p class="muted">Your rank is calculated from saved test performance.</p><div id="rank" class="big">Loading...</div><div id="details"></div></div><div class="card"><h2>How LT Rank works</h2><p>Rank is based on average percentage across your saved tests. It is designed to show learning progress, not to pressure students.</p></div></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dateOf(x){if(!x)return null; if(x.toDate)return x.toDate(); const d=new Date(x); return isNaN(d)?null:d;}
document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='index.html'};onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}try{const mine=await getDocs(query(collection(db,'testResults'),where('uid','==',user.uid)));let m=[];mine.forEach(d=>m.push(d.data()));let mt=m.reduce((n,x)=>n+(Number(x.total)||0),0),ms=m.reduce((n,x)=>n+(Number(x.score)||0),0),pct=mt?Math.round(ms/mt*100):0;let all=await getDocs(collection(db,'testResults')),scores={};all.forEach(d=>{let x=d.data(),t=Number(x.total)||0,s=Number(x.score)||0;if(x.uid&&t){scores[x.uid]??={s:0,t:0};scores[x.uid].s+=s;scores[x.uid].t+=t}});let list=Object.entries(scores).map(([uid,x])=>({uid,p:x.t?x.s/x.t*100:0})).sort((a,b)=>b.p-a.p);let pos=pct?list.findIndex(x=>x.uid===user.uid)+1:0;document.getElementById('rank').textContent=pos?`#${pos}`:'Not ranked yet';document.getElementById('details').innerHTML=pct?`<p>Your average: <b>${pct}%</b></p><p class="muted">Ranking includes students whose test results are readable under your Firestore rules.</p>`:'<p>Take a test to receive an LT Rank.</p>'}catch(e){document.getElementById('rank').textContent='Not available';document.getElementById('details').innerHTML='<p class="muted">Your Firestore security rules may prevent reading all student results. Your personal results are not affected.</p>'}});</script></body></html>
