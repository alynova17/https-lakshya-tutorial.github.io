<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Progress</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.top{background:#111827;color:white;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.big{font-size:34px;font-weight:800}.muted{color:#6b7280}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.dark{background:#111827;color:white}.light{background:#e5e7eb;color:#111827}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">LT — My Progress</div><button class="btn light" id="logout">Logout</button></header><main class="wrap"><div class="card"><button class="btn light" onclick="location.href='student-dashboard.html'">← Dashboard</button> <button class="btn dark" onclick="location.href='tests.html'">Take a Test</button></div><div class="card"><h1>📊 My Progress</h1><p class="muted">Your test performance at a glance.</p><div id="summary">Loading...</div></div><div class="grid"><div class="card"><h3>Average Score</h3><div class="big" id="avg">—</div></div><div class="card"><h3>Tests Completed</h3><div class="big" id="count">—</div></div></div><div class="card"><h2>Subject Performance</h2><div id="subjects">Loading...</div></div><div class="card"><h2>Recent Results</h2><div id="results">Loading...</div></div></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dateOf(x){if(!x)return null; if(x.toDate)return x.toDate(); const d=new Date(x); return isNaN(d)?null:d;}
document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='index.html'};onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}try{const st=await getDoc(doc(db,'students',user.uid));const q=await getDocs(query(collection(db,'testResults'),where('uid','==',user.uid)));let a=[];q.forEach(d=>a.push(d.data()));a.sort((x,y)=>(dateOf(y.createdAt)?.getTime()||0)-(dateOf(x.createdAt)?.getTime()||0));const total=a.reduce((n,x)=>n+(Number(x.total)||0),0),score=a.reduce((n,x)=>n+(Number(x.score)||0),0),avg=total?Math.round(score/total*100):0;document.getElementById('avg').textContent=avg+'%';document.getElementById('count').textContent=a.length;document.getElementById('summary').textContent=a.length?'Keep learning and use your results to see where you can improve.':'No test results yet — take your first test!';let map={};a.forEach(x=>{let k=x.subject||'Other';(map[k]??=[]).push(x)});let sh='';Object.entries(map).forEach(([k,v])=>{let t=v.reduce((n,x)=>n+(Number(x.total)||0),0),s=v.reduce((n,x)=>n+(Number(x.score)||0),0),p=t?Math.round(s/t*100):0;sh+=`<div class="row"><span><b>${esc(k)}</b><br><span class="muted">${v.length} test(s)</span></span><b>${p}%</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`});document.getElementById('subjects').innerHTML=sh||'<p class="muted">No subject data yet.</p>';document.getElementById('results').innerHTML=a.slice(0,10).map(x=>`<div class="row"><span><b>${esc(x.testName||'Test')}</b><br><span class="muted">${esc(x.subject||'')} ${esc(x.chapter||'')}</span></span><b>${Number(x.score)||0}/${Number(x.total)||0}</b></div>`).join('')||'<p class="muted">No results yet.</p>'}catch(e){document.getElementById('summary').textContent='Progress is unavailable right now. Your test system can still be used.'}});</script></body></html>
