<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LT Badges</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.top{background:#111827;color:white;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.big{font-size:34px;font-weight:800}.muted{color:#6b7280}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.dark{background:#111827;color:white}.light{background:#e5e7eb;color:#111827}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">LT — LT Badges</div><button class="btn light" id="logout">Logout</button></header><main class="wrap"><div class="card"><button class="btn light" onclick="location.href='student-dashboard.html'">← Dashboard</button> <button class="btn dark" onclick="location.href='tests.html'">Take a Test</button></div><div class="card"><h1>🎖️ LT Badges</h1><p class="muted">Achievements you can unlock through normal learning activity.</p></div><div class="grid" id="badges">Loading...</div></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dateOf(x){if(!x)return null; if(x.toDate)return x.toDate(); const d=new Date(x); return isNaN(d)?null:d;}
document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='index.html'};onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}try{const q=await getDocs(query(collection(db,'testResults'),where('uid','==',user.uid)));let a=[];q.forEach(d=>a.push(d.data()));let tests=a.length,total=a.reduce((n,x)=>n+(Number(x.total)||0),0),score=a.reduce((n,x)=>n+(Number(x.score)||0),0),avg=total?score/total*100:0;let defs=[['🌱 First Step','Complete your first test',tests>=1],['📝 Test Taker','Complete 5 tests',tests>=5],['🎯 Strong Start','Reach 70% average',avg>=70],['⭐ High Achiever','Reach 85% average',avg>=85],['🏅 Consistent Learner','Complete 10 tests',tests>=10]];document.getElementById('badges').innerHTML=defs.map(x=>`<div class="card"><h2>${x[0]}</h2><p>${x[1]}</p><b>${x[2]?'Unlocked ✓':'Locked'}</b></div>`).join('')}catch(e){document.getElementById('badges').innerHTML='<div class="card">Badges will appear after you complete tests.</div>'}});</script></body></html>
